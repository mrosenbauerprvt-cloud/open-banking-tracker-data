<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>x-sale · KI-Agenten mieten</title>
  <meta name="description" content="x-sale – der Marktplatz, auf dem Du fertige KI-Agenten flexibel mietest." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Kopfzeile / Navigation -->
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#" data-route="market">
        <span class="brand-mark">x</span>
        <span class="brand-name">x-sale</span>
      </a>

      <nav class="main-nav">
        <a href="#" data-route="market" class="nav-link">Marktplatz</a>
        <a href="#" data-route="dashboard" class="nav-link">Meine Agenten</a>
        <a href="#" data-route="activity" class="nav-link">Aktivität</a>
        <a href="#" data-route="provider" class="nav-link">Anbieter</a>
        <a href="#" data-route="how" class="nav-link">So funktioniert's</a>
      </nav>

      <div class="header-right">
        <button class="account-button" id="account-button" aria-label="Konto">
          <span id="account-label">👤 Anmelden</span>
        </button>
        <button class="cart-button" id="cart-button" aria-label="Warenkorb öffnen">
          🛒 <span class="cart-count" id="cart-count">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Hier wird die jeweilige Seite eingefügt -->
  <main id="app" class="container"></main>

  <!-- Warenkorb-Schublade -->
  <aside class="cart-drawer" id="cart-drawer" aria-hidden="true">
    <div class="cart-drawer-head">
      <h2>Dein Warenkorb</h2>
      <button class="icon-btn" id="cart-close" aria-label="Schließen">✕</button>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-foot">
      <div class="cart-total">
        <span>Summe / Monat</span>
        <strong id="cart-total">0 €</strong>
      </div>
      <button class="btn btn-primary btn-block" id="checkout-btn">Jetzt mieten</button>
    </div>
  </aside>
  <div class="overlay" id="overlay" hidden></div>

  <!-- Konto-Fenster (einfaches Anmelden ohne Passwort) -->
  <div class="modal" id="account-modal" hidden>
    <div class="modal-card">
      <button class="icon-btn modal-close" id="account-close" aria-label="Schließen">✕</button>
      <h2 id="account-title">Willkommen bei x-sale 👋</h2>
      <p class="modal-text">Gib Deinen Namen ein – dann begrüßt Dich x-sale persönlich und Du sammelst XP.</p>
      <input id="account-name" type="text" placeholder="Dein Name…" />
      <button class="btn btn-primary btn-block" id="account-save">Los geht's (lokal)</button>

      <div class="account-divider"><span>oder echtes Konto (Server)</span></div>
      <input id="account-email" type="email" placeholder="E-Mail…" />
      <input id="account-password" type="password" placeholder="Passwort…" />
      <div class="account-row">
        <button class="btn btn-ghost" id="account-register">Registrieren</button>
        <button class="btn btn-primary" id="account-login">Anmelden</button>
      </div>
      <p class="modal-text" id="account-server-note" style="margin-top:10px"></p>

      <div id="account-stats"></div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> x-sale · Prototyp · KI-Agenten flexibel mieten</p>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
